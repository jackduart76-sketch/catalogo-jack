<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jack | Moda Íntima</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff0f5;
            color: #4a4a4a;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            background-color: #d87093;
            color: white;
            padding: 40px 20px;
        }
        header h1 {
            margin: 0;
            font-size: 2.5rem;
            letter-spacing: 2px;
        }
        header p {
            font-size: 1.1rem;
            margin-top: 10px;
            font-weight: 300;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .produto-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(216, 112, 147, 0.15);
            overflow: hidden;
            margin-bottom: 30px;
            border: 1px solid #ffc0cb;
        }
        .produto-card img {
            width: 100%;
            max-height: 450px;
            object-fit: cover;
        }
        .produto-info {
            padding: 20px;
        }
        .produto-info h3 {
            margin: 0 0 10px;
            color: #c71585;
            font-size: 1.5rem;
        }
        .produto-info p {
            color: #666;
            font-size: 1rem;
            margin-bottom: 20px;
        }
        .btn-whats {
            display: inline-block;
            background-color: #25d366;
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            transition: background 0.3s;
        }
        .btn-whats:hover {
            background-color: #1ebe57;
        }
        footer {
            margin-top: 50px;
            padding: 20px;
            color: #888;
            font-size: 0.9rem;
            background-color: #ffe4e1;
        }
    </style>
</head>
<body>

    <header>
        <h1>JACK</h1>
        <p>Moda Íntima — Elevando a autoestima com conforto e estilo</p>
    </header>

    <div class="container">
        <div class="produto-card">
            <img src="3155347f-a09e-4cbe-b9d2-cbda29ff7be8.jpeg" alt="Peça de Moda Íntima">
            <div class="produto-info">
                <h3>Coleção Exclusiva</h3>
                <p>Elegância e conforto pensados especialmente para si.</p>
                <a href="https://wa.me/" class="btn-whats" target="_blank">Pedir pelo WhatsApp</a>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Jack | Moda Íntima. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
