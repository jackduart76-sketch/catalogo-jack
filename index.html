<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jack | Moda Íntima</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fcf4f6;
            color: #4a3b4c;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(212, 165, 175, 0.3);
            max-width: 500px;
            width: 90%;
            border: 2px solid #e8c5cc;
        }
        h1 {
            color: #8b5a6b;
            margin-bottom: 10px;
            font-size: 28px;
        }
        p {
            color: #6b5b6e;
            font-size: 16px;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background-color: #b07d91;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s;
            box-shadow: 0 4px 10px rgba(176, 125, 145, 0.4);
        }
        .btn:hover {
            background-color: #9a687d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>JACK</h1>
        <p>Moda Íntima<br>Elevando sua autoestima com conforto e estilo. 💜</p>
        <a href="https://wa.me/" class="btn" target="_blank">Fale Connosco no WhatsApp</a>
    </div>
</body>
</html>
